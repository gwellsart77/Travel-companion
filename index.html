button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
.top h1{font-size:1.25rem;flex:1;min-width:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.9rem;font-weight:600}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.big.stop{background:var(--surface-2);color:var(--fg)}

.small{font-size:.85rem}
.label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

.dist{font-variant-numeric:tabular-nums;font-weight:600}

.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.ev{display:grid;grid-template-columns:62px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px}
.ev:first-of-type{border-top:0;padding-top:0}

.phr .loc{font-size:1.15rem;font-weight:600;font-family:var(--display)}

.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.show{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;

.show .huge{font-family:var(--display);font-size:clamp(2.2rem,11vw,4.5rem);line-height:1.1;overflow-wrap:anywhere}

.answer{white-space:pre-wrap}
details summary{cursor:pointer;font-weight:600}
.vlist{margin:6px 0;padding-left:18px}
.nn{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-top:1px solid var(--line);padding:8px 0}
a{color:var(--accent)}

/* ===================== Storage (per phone) ===================== */
const S = {
  get(k, d){ try { const v = localStorage.getItem("tca." + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem("tca." + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ mode: "A", rangeMi: 0.5, cap: 3, voice: true, accent: true, deviceVoice: false, trRate: 0.8, nudges: true, autoTrip: true }, S.get("settings", {}));
function saveSettings(){ S.set("settings", settings); }

/* ===================== Helpers ===================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MI = 1609.344;
function distM(a, b){
  const R = 6371000, t = Math.PI / 180;
  const dLa = (b.lat - a.lat) * t, dLo = (b.lon - a.lon) * t;
  const x = Math.sin(dLa / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin(dLo / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(x));
}
/* Rough walk time: straight line x 1.3 for streets, 80 m a minute. */
const walkMin = m => Math.max(1, Math.round(m * 1.3 / 80));
function fmtDist(m){ const mi = m / MI; return mi < 0.1 ? Math.round(m * 3.281) + " ft" : mi.toFixed(mi < 10 ? 1 : 0) + " mi"; }
function trip(){ return TRIPS[state.trip] || Object.values(TRIPS)[0]; }
function tz(){ return trip().tz; }
function partsIn(date, zone){
  const p = {}; new Intl.DateTimeFormat("en-US", { timeZone: zone, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short", hourCycle: "h23" })
    .formatToParts(date).forEach(x => p[x.type] = x.value);
  return p;
}
function dayKey(date = new Date(), zone = tz()){ const p = partsIn(date, zone); return p.year + "-" + p.month + "-" + p.day; }
function fmtTime(date, zone = tz()){ return new Intl.DateTimeFormat("en-US", { timeZone: zone, hour: "numeric", minute: "2-digit" }).format(date); }
function fmtDay(date, zone = tz()){ return new Intl.DateTimeFormat("en-US", { timeZone: zone, weekday: "long", month: "short", day: "numeric" }).format(date); }
function toast(msg){ const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3200); }
function mapsLink(p){
  if (p.lat != null) return "https://maps.apple.com/?daddr=" + p.lat + "," + p.lon + "&dirflg=w";
  return "https://maps.apple.com/?q=" + encodeURIComponent(p.name + ", " + (p.address || trip().name));
}

/* ===================== State ===================== */
const state = {
  trip: S.get("trip", null),
  pos: null,            // {lat, lon, acc, ts, source}
  walking: false,
  gpsBlocked: false,
  watchId: null,
  lastAlert: null,
  tab: "now",
  claude: { tts: null, sample: null, db: null, uid: null }
};
function today(){ return dayKey(); }
function daily(){
  const d = S.get("daily", {});
  if (d.day !== today()) return { day: today(), count: 0, hushed: false, nudged: [], alerts: [] };
  return d;
}
function saveDaily(d){ S.set("daily", d); }
function alertedSet(){ return new Set(S.get("alerted." + state.trip, [])); }
function testPins(){ return S.get("pins." + state.trip, []); }
function myEvents(){ return S.get("events", []); }
function allPlaces(){ return (trip().places || []).concat(testPins()); }
function allEvents(){
  const own = myEvents(), over = S.get("evOverride", {});
  return BUNDLED_EVENTS.concat(own).filter(e => e.trip === state.trip)
    .map(e => Object.assign({}, e, over[e.id] || {}))
    .sort((a, b) => new Date(a.start) - new Date(b.start));
}

/* ===================== Sound and voice ===================== */
let actx = null;
function unlockAudio(){
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === "suspended") actx.resume(); } catch (e) {}
}
function chime(){
  if (!actx) return;
  try {
    const now = actx.currentTime;
    [[784, 0], [1175, 0.18]].forEach(([f, t]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "sine"; o.frequency.value = f; o.connect(g); g.connect(actx.destination);
      g.gain.setValueAtTime(0.0001, now + t); g.gain.exponentialRampToValueAtTime(0.35, now + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, now + t + 0.5); o.start(now + t); o.stop(now + t + 0.55);
    });
  } catch (e) {}
}
/* Voice choice. Prefer Enhanced/Premium voices when the phone shows them to the page (iOS 18+ often doesn't),
   otherwise the warmest built-in one; skip the robotic and novelty voices. */
const ROBOT = /eloquence|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i;
const WARM = /Premium|Enhanced|Natural|Neural/i;
const FEMALE = /Samantha|Ava|Allison|Susan|Zoe|Nicky|Karen|Moira|Tessa|Serena|Fiona|Victoria|Anna|Helena|Petra|Marlene|Zuzana|Aria|Jenny|Zira|female/i;
function allVoices(){ try { return speechSynthesis.getVoices() || []; } catch (e) { return []; } }
function voiceScore(v, lang){
  const vl = (v.lang || "").toLowerCase().replace("_", "-"), l = lang.toLowerCase();
  let s;
  if (vl === l) s = 6; else if (vl.slice(0, 2) === l.slice(0, 2)) s = 4; else return -99;
  if (ROBOT.test(v.name || "") || ROBOT.test(v.voiceURI || "")) s -= 20;
  if (WARM.test(v.name || "") || /premium|enhanced/i.test(v.voiceURI || "")) s += 5;
  if (FEMALE.test(v.name || "")) s += 2;
  if (v.localService) s += 1;
  return s;
}
function voicesFor(lang){ return allVoices().filter(v => voiceScore(v, lang) > -99).sort((a, b) => voiceScore(b, lang) - voiceScore(a, lang)); }
function pickVoice(lang){
  const want = S.get("voice." + lang.slice(0, 2), "");
  const list = voicesFor(lang);
  return (want && list.find(v => (v.voiceURI || v.name) === want)) || list[0] || null;
}
/* English is spoken in the city's accent when "Local accent" is on: Vienna's voice is German, Prague's Czech. */
function englishLang(){ return settings.accent && trip().accent ? trip().accent : "en-US"; }
/* Speed for phrases and the translator: slower so words are easy to follow. */
const RATES = [[0.7, "Slower"], [0.8, "Easy"], [1, "Normal"]];
function slowRate(){ const r = +settings.trRate; return r >= 0.5 && r <= 1.2 ? r : 0.8; }
function voiceTag(v){
  const id = (v.name || "") + " " + (v.voiceURI || "");
  if (ROBOT.test(id)) return "robotic";
  if (/premium/i.test(id)) return "Premium";
  if (/enhanced/i.test(id)) return "Enhanced";
  if (/natural|neural/i.test(id)) return "Natural";
  return "built-in";
}
function voiceListText(){
  const vs = allVoices();
  return "Voices this page can use (" + vs.length + "):\n" + vs.map(v => "- " + v.name + " (" + v.lang + ", " + voiceTag(v) + ")").join("\n");
}
function speak(text, lang, opt){
  if (!settings.voice) return false;
  const slow = !!(opt && opt.slow);
  const english = !lang;
  const L = lang || englishLang();
  const tts = state.claude.tts;
  if (tts && L.startsWith("en") && !settings.deviceVoice) {
    tts.speak(text, slow ? { voice: "buttery", language: "en", rate: Math.max(0.7, slowRate()) } : { voice: "buttery", language: "en" }).catch(() => speakDevice(text, L, english, slow));
    return true;
  }
  return speakDevice(text, L, english, slow);
}
function speakDevice(text, L, english, slow){
  if (!("speechSynthesis" in window)) return false;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(L);
    u.lang = v ? v.lang : L;
    if (v) u.voice = v;
    u.rate = slow ? slowRate() : (english && !L.startsWith("en") ? 0.92 : 0.96); u.pitch = 1;
    speechSynthesis.speak(u);
    return true;
  } catch (e) { return false; }
}
function stopVoice(){ try { speechSynthesis.cancel(); } catch (e) {} try { state.claude.tts && state.claude.tts.stop(); } catch (e) {} }
function hush(){ const d = daily(); d.hushed = true; saveDaily(d); stopVoice(); toast("Hushed for the rest of today"); render(); }

/* ===================== Field log ===================== */
function log(kind, text, extra){
  const entry = Object.assign({ kind, text, at: new Date().toISOString(), trip: state.trip }, extra || {});
  const l = S.get("log", []); l.unshift(entry); S.set("log", l.slice(0, 200));
  cloudSave(kind + "-" + Date.now(), entry);
}
function cloudSave(id, data){
  const c = state.claude;
  if (!c.db || !c.uid) return;
  c.db.collection("data/users/" + c.uid).doc(id).set(data).catch(() => {});
}

/* ===================== Location ===================== */
let wakeLock = null;
async function keepAwake(){ try { if ("wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen"); } catch (e) { wakeLock = null; } }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && state.walking) keepAwake(); });

function startWalk(){
  unlockAudio();
  state.walking = true;
  speak("Walk started. I'll stay quiet unless something good is close.");
  keepAwake();
  /* Claude pages get no location access, so go straight to tap-your-spot mode. */
  if (MANUAL || !("geolocation" in navigator)) { state.gpsBlocked = true; log("walk", "Walk started (tap your spot)"); render(); return; }
  try {
    state.watchId = navigator.geolocation.watchPosition(onPos, onPosErr, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  } catch (e) { onPosErr({ code: 1, message: String(e) }); }
  log("walk", "Walk started");
  render();
}
function stopWalk(){
  state.walking = false;
  if (state.watchId != null) try { navigator.geolocation.clearWatch(state.watchId); } catch (e) {}
  state.watchId = null;
  try { wakeLock && wakeLock.release(); } catch (e) {}
  wakeLock = null;
  log("walk", "Walk stopped");
  render();
}
function onPos(p){
  state.gpsBlocked = false;
  setPos({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0), ts: Date.now(), source: "gps" });
}
function onPosErr(e){
  if (e && e.code === 1) { state.gpsBlocked = true; log("gps", "Location blocked or denied"); }
  else log("gps", "Location error " + (e && e.code));
  render();
}
const MANUAL = !!window.claude;
/* Spots you can tap: places with a map pin, plus neighborhood centers (areas never alert). */
function spots(){ return allPlaces().filter(p => p.lat != null).concat(trip().areas || []); }
function pickSpot(id){
  const tr = trip();
  const p = id === "__center" ? { id, name: tr.name + " center", lat: tr.center.lat, lon: tr.center.lon } : spots().find(x => x.id === id);
  if (!p) return;
  if (!state.walking) startWalk();
  S.set("spot." + state.trip, p.id);
  state.spotsOpenUntil = 0;
  setPos({ lat: p.lat, lon: p.lon, acc: 0, ts: Date.now(), source: "manual", spot: p.id, name: p.name });
}
/* GPS fixes come every second or two. Redraw when you've moved about 25 m, every 15 s, or on Refresh,
   so the screen follows you without jumping on every fix. */
function setPos(pos, force){
  const first = !state.pos || state.pos.source !== pos.source;
  state.pos = pos;
  if (pos.source === "gps" && settings.autoTrip) autoTrip();
  tick();
  const L = state.lastDraw;
  if (pos.source !== "gps" || first || force || state.dirty || !L || distM(L, pos) >= 25 || Date.now() - L.at >= 15000) {
    state.lastDraw = { lat: pos.lat, lon: pos.lon, at: Date.now() }; state.dirty = false; render();
  } else { const st = statusLine(); $("#dot").className = "dot " + st.cls; $("#statusText").textContent = st.text; }
}
function ago(ts){ const s = Math.round((Date.now() - ts) / 1000); return s < 10 ? "just now" : s < 60 ? s + " sec ago" : Math.round(s / 60) + " min ago"; }
function liveGps(){ return !MANUAL && "geolocation" in navigator && !state.gpsBlocked; }
function fromLine(){
  if (!state.pos) return "";
  return state.pos.source === "gps" ? "From where you are now (GPS, within " + state.pos.acc + " m), updated " + ago(state.pos.ts) + "." : "From " + (state.pos.name || "your spot") + ", the last spot you tapped.";
}
function refreshNear(){
  if (liveGps()) {
    if (!state.walking) { startWalk(); return; }
    toast("Finding you...");
    try { navigator.geolocation.getCurrentPosition(p => { state.gpsBlocked = false; setPos({ lat: p.coords.latitude, lon: p.coords.longitude, acc: Math.round(p.coords.accuracy || 0), ts: Date.now(), source: "gps" }, true); toast("Updated"); }, onPosErr, { enableHighAccuracy: true, maximumAge: 0, timeout: 15000 }); }
    catch (e) { onPosErr({ code: 1 }); }
    return;
  }
  const saved = (state.pos && state.pos.spot) || S.get("spot." + state.trip, "");
  if (!state.pos && saved && spots().some(p => p.id === saved)) pickSpot(saved);
  state.spotsOpenUntil = Date.now() + 300000;
  render();
  const c = $("#spotCard"); c && c.scrollIntoView && c.scrollIntoView({ block: "start" });
  toast("Tap the spot you're at now");
}
function autoTrip(){
  let best = null, bestD = Infinity;
  for (const [k, t] of Object.entries(TRIPS)) { const d = distM(state.pos, t.center); if (d < bestD) { bestD = d; best = k; } }
  if (best && best !== state.trip && bestD < 80000) { state.trip = best; S.set("trip", best); state.dirty = true; toast("Switched to " + TRIPS[best].name); }
}

/* ===================== Opening hours ===================== */
/* hours: [{d:[0..6 Sun=0], o:"10:00", c:"18:00"}]. Unknown hours return null (alerts allowed, never claimed open). */
function openNow(p, date = new Date()){
  if (!p.hours) return null;
  const x = partsIn(date, tz());
  const wd = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(x.weekday);
  const hm = x.hour + ":" + x.minute;
  return p.hours.some(h => h.d.includes(wd) && hm >= h.o && hm < h.c);
}

/* ===================== Nearby alerts ===================== */
function inFixedEvent(now = new Date()){
  return allEvents().some(e => e.end && new Date(e.start) <= now && now < new Date(e.end) && e.status !== "option");
}
function nearbyList(){
  const list = allPlaces().map(p => {
    const d = (state.pos && p.lat != null) ? distM(state.pos, p) : null;
    return Object.assign({}, p, { d, open: openNow(p) });
  });
  if (state.pos) list.sort((a, b) => (a.d ?? 1e12) - (b.d ?? 1e12));
  else list.sort((a, b) => (b.taste || 0) - (a.taste || 0));
  return list;
}
function checkNearby(){
  if (!state.pos) return;
  const d = daily();
  if (settings.mode === "off" || d.hushed || d.count >= settings.cap || inFixedEvent()) return;
  const seen = alertedSet(), range = settings.rangeMi * MI;
  const cands = nearbyList().filter(p => p.d != null && p.d <= range && !seen.has(p.id) && p.open !== false && (p.taste || 0) >= 3)
    .sort((a, b) => (b.taste - a.taste) || (a.d - b.d));
  if (!cands.length) return;
  fireAlert(cands[0]);
}
function alertSentence(p){ const m = walkMin(p.d); return p.line + " About " + m + (m === 1 ? " minute" : " minutes") + " walk."; }
function fireAlert(p){
  const d = daily(); d.count++; d.alerts.push(p.id); saveDaily(d);
  const seen = alertedSet(); seen.add(p.id); S.set("alerted." + state.trip, [...seen]);
  state.dirty = true;
  state.lastAlert = { id: p.id, name: p.name, sentence: alertSentence(p), at: Date.now(), place: p };
  chime();
  if (settings.mode === "A") setTimeout(() => speak(state.lastAlert.sentence), 900);
  log("alert", p.name + " (" + fmtDist(p.d) + ")", { mode: settings.mode, distM: Math.round(p.d) });
  if (state.tab !== "now") toast("Nearby: " + p.name);
}

/* ===================== Time nudges ===================== */
function nudgePlan(e){
  const start = new Date(e.start);
  const lead = (e.place && e.place.lat != null && state.pos) ? walkMin(distM(state.pos, e.place)) : 0;
  const leadTxt = lead ? " About " + lead + " minutes walk." : "";
  if (e.nudges) return e.nudges.map((n, i) => ({ id: e.id + ":" + i, at: new Date(start - n.min * 60000), text: n.text }));
  if (e.mustMake) return [
    { id: e.id + ":early", at: new Date(start - (lead + 45) * 60000), text: "Heads up. " + e.title + " at " + fmtTime(start) + "." + leadTxt },
    { id: e.id + ":go", at: new Date(start - (lead + 5) * 60000), text: "Time to go. " + e.title + " at " + fmtTime(start) + "." + leadTxt }
  ];
  return [{ id: e.id + ":one", at: new Date(start - (lead + 15) * 60000), text: "Heads up. " + e.title + " at " + fmtTime(start) + "." + leadTxt }];
}
function checkNudges(now = new Date()){
  if (!settings.nudges) return;
  const d = daily();
  for (const e of allEvents()) {
    if (e.status === "option") continue;
    for (const n of nudgePlan(e)) {
      if (d.nudged.includes(n.id)) continue;
      const late = now - n.at;
      if (late >= 0 && late < 15 * 60000 && now < new Date(e.start)) {
        d.nudged.push(n.id); saveDaily(d);
        chime(); setTimeout(() => speak(n.text), 900);
        state.lastNudge = { text: n.text, at: Date.now() };
        log("nudge", n.text);
        toast(n.text);
      }
    }
  }
}
function tick(){ checkNudges(); checkNearby(); }
setInterval(() => { tick(); if (state.tab === "now" || state.tab === "day") render(); }, 20000);

/* ===================== Ask Claude ===================== */
function contextText(){
  const t = trip(), now = new Date();
  const lines = [];
  lines.push("City: " + t.name + ". Local time: " + fmtDay(now) + ", " + fmtTime(now) + ".");
  if (state.pos) {
    const near = nearbyList().filter(p => p.d != null).slice(0, 5).map(p => p.name + " (" + walkMin(p.d) + " min walk)");
    lines.push("His location: " + state.pos.lat.toFixed(4) + ", " + state.pos.lon.toFixed(4) + " (" + state.pos.source + "). Nearest known places: " + (near.join("; ") || "none"));
  } else lines.push("His location: unknown.");
  const evs = allEvents().filter(e => dayKey(new Date(e.start)) === today());
  lines.push("Today's fixed plans: " + (evs.map(e => fmtTime(new Date(e.start)) + " " + e.title + " [" + (e.status || "set") + "]").join("; ") || "none"));
  lines.push("Places in his trip notes:");
  allPlaces().forEach(p => lines.push("- " + p.name + " | " + (p.tags || []).join(", ") + " | hours: " + (p.hoursText || "not checked") + (p.price ? " | price: " + p.price : "") + " | " + (p.note || p.line || "")));
  return lines.join("\n");
}
function askPrompt(q){
  return "You are Gabe's travel companion, speaking into his headphones while he walks. Answer in one to three short sentences that sound natural read aloud. Plain words, no lists, no markdown, no em dashes.\n" +
    "Hard rule: for opening hours, prices, schedules and addresses use only the facts below. If they don't cover it, say you don't know and suggest checking the place's own site. General knowledge about language, customs or what a neighborhood is like is fine; say when it's general.\n" +
    "His taste: grassroots art, places where art is made, local food, culture. Not tourist traps.\n\n" + contextText() + "\n\nHis question: " + q;
}
let askCtl = null;
async function ask(){
  const q = $("#askQ").value.trim(); if (!q) return;
  unlockAudio();

      "&current=temperature_2m,precipitation&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&timezone=auto&forecast_days=1");

    '<label class="small">English voice</label>' + voiceOptions("en-US") +
    (acc ? '<label class="small">' + esc(t.name) + " voice</label>" + voiceOptions(t.accent) : "") +
    (claudeVoice ? '<label class="row small"><input type="checkbox" id="setDeviceVoice"' + (settings.deviceVoice ? " checked" : "") + "> Use the phone's voice instead of Claude's</label>" : "") +
    '<div class="row"><button class="btn" id="testVoice">Hear this voice</button></div>' +
    '<label class="small">Phrase and translator speed</label><div class="seg" role="group" aria-label="Speech speed">' +
    RATES.map(([r, n]) => '<button data-rate="' + r + '" aria-pressed="' + (Math.abs(slowRate() - r) < 0.01) + '">' + n + "</button>").join("") + "</div>" +
    (claudeVoice ? "" : '<p class="small muted">Want a less robotic voice? On iPhone: Settings, Accessibility, Read &amp; Speak (or Spoken Content), Voices. Download an Enhanced or Premium one, like Ava. If the list below shows it, the app uses it. Newer iPhones often hide downloaded voices from web pages.</p>') +
    voicesSeen() +
    "</div>";
  return h;
}
function voicesSeen(){
  const vs = allVoices();
  const good = vs.filter(v => /Premium|Enhanced|Natural/.test(voiceTag(v)));
  return '<details class="small"><summary>Voices this page can use (' + vs.length + ")" + (good.length ? ", " + good.length + " Enhanced or Premium" : ", none Enhanced or Premium") + "</summary>" +
    (vs.length ? '<ul class="vlist">' + vs.map(v => "<li>" + esc(v.name) + ' <span class="muted">' + esc(v.lang + ", " + voiceTag(v)) + "</span></li>").join("") + "</ul>" : '<p class="muted">The phone hasn\'t listed any voices yet. Tap Hear this voice, then look again.</p>') +
    '<div class="row"><button class="btn small" id="copyVoices">Copy this list</button></div></details>';
}
function viewMore(){
  const t = trip(), ws = S.get("wishes", []), lg = S.get("log", []).slice(0, 12);
  let h = '<div class="card"><div class="label">Wish it did...</div><p class="small">Any moment you wish this app did something, say it here. These notes shape the real app.</p>' +
    '<textarea id="wishT" placeholder="I wish it told me..."></textarea><div class="row"><button class="btn primary" id="wishAdd">Save note</button>' +
    (ws.length ? '<button class="btn" id="wishCopy">Copy all notes</button>' : "") + "</div>" +
    ws.slice(0, 8).map(w => '<div class="small" style="border-top:1px solid var(--line);padding-top:8px">' + esc(w.text) + '<div class="muted">' + esc(new Date(w.at).toLocaleString()) + (w.near ? ", near " + esc(w.near) : "") + "</div></div>").join("") + "</div>";
  h += '<div class="card"><div class="label">Papers for ' + esc(t.name) + '</div><p class="small muted">Labels only. Nothing is stored here but where to find each paper.</p>' +
    (t.docs || []).map(d => '<div class="place"><div class="name">' + esc(d.label) + '</div><div class="small">' + esc(d.where) + '</div><div class="small muted">Needed: ' + esc(d.when) + "</div></div>").join("") + "</div>";
  h += '<div class="card"><div class="label">Settings</div>' +
    '<label class="small">Alert range</label><div class="seg" role="group">' + [0.1, 0.25, 0.5, 1].map(v => '<button data-range="' + v + '" aria-pressed="' + (settings.rangeMi === v) + '">' + v + " mi</button>").join("") + "</div>" +
    '<label class="small">Alerts per day</label><div class="seg" role="group">' + [1, 2, 3, 5].map(v => '<button data-cap="' + v + '" aria-pressed="' + (settings.cap === v) + '">' + v + "</button>").join("") + "</div>" +
    '<label class="row small"><input type="checkbox" id="setVoice"' + (settings.voice ? " checked" : "") + "> Speak out loud</label>" +
    '<label class="row small"><input type="checkbox" id="setNudges"' + (settings.nudges ? " checked" : "") + "> Time nudges for fixed plans</label>" +
    '<label class="row small"><input type="checkbox" id="setAuto"' + (settings.autoTrip ? " checked" : "") + "> Switch city by where I am</label>" +
    '<div class="row"><button class="btn" id="testSound">Test chime and voice</button></div></div>';
  if (BUILD.plansLink) h += '<div class="card"><div class="label">Live GPS version</div><p class="small">The same app on its own web page, where live GPS and the Talk button work. This button also loads your trip plans onto your phone (they stay on the phone, not on the web page).</p>' +
    '<div class="row"><a class="btn primary" href="' + esc(BUILD.plansLink) + '" target="_blank" rel="noopener">Open with my plans</a></div><p class="small muted">On that page, tap Share, then Add to Home Screen, to use it like an app.</p></div>';
  h += voiceCard();
  h += '<div class="card"><details><summary>Today\'s field log</summary><div class="small" style="margin-top:8px">' +
    (lg.length ? lg.map(l => '<div><span class="muted">' + esc(new Date(l.at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })) + "</span> " + esc(l.text) + "</div>").join("") : "Nothing yet.") +
    "</div></details></div>";
  h += '<div class="card"><details><summary>What this test version can and can\'t do</summary><div class="small" style="margin-top:8px;display:flex;flex-direction:column;gap:6px">' + BUILD.limits.map(x => "<p style=\"margin:0\">" + esc(x) + "</p>").join("") +
    '<p class="muted" style="margin:0">Version ' + esc(BUILD.version) + ", " + esc(BUILD.kind) + "</p></div></details></div>";
  return h;
}
function render(){
  const sel = $("#tripSel");
  sel.innerHTML = Object.entries(TRIPS).map(([k, t]) => '<option value="' + k + '"' + (k === state.trip ? " selected" : "") + ">" + esc(t.name + (t.role ? " (" + t.role + ")" : "")) + "</option>").join("");
  const st = statusLine();
  $("#dot").className = "dot " + st.cls; $("#statusText").textContent = st.text;
  const focusId = document.activeElement && document.activeElement.id;
  const keep = {}; ["askQ", "wishT", "pinName", "evTitle", "evTime", "trText"].forEach(id => { const el = document.getElementById(id); if (el) keep[id] = el.value; });
  const v = { now: viewNow, near: viewNear, day: viewDay, phrases: viewPhrases, more: viewMore }[state.tab];
  ["now", "near", "day", "phrases", "more"].forEach(k => { const el = $("#v-" + k); el.hidden = k !== state.tab; if (k === state.tab) el.innerHTML = v(); else el.innerHTML = ""; });
  Object.entries(keep).forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; });
  if (focusId) { const el = document.getElementById(focusId); if (el && el.focus) el.focus(); }
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.tab === state.tab ? "page" : "false"));
  if (state.tab === "now") refreshWeather();
}

/* ===================== Events (taps) ===================== */
document.addEventListener("click", e => {
  const b = e.target.closest("button, a"); if (!b) return;
  unlockAudio();
  if (b.dataset.tab) { state.tab = b.dataset.tab; render(); window.scrollTo(0, 0); return; }
  if (b.id === "walkBtn") return state.walking ? stopWalk() : startWalk();
  if (b.id === "refreshNear") { if (!liveGps()) state.tab = "now"; return refreshNear(); }
  if (b.dataset.spot) { pickSpot(b.dataset.spot); window.scrollTo(0, 0); return; }
  if (b.id === "hushBtn") return hush();
  if (b.dataset.mode) { settings.mode = b.dataset.mode; saveSettings(); render(); return; }
  if (b.id === "sayAlert" && state.lastAlert) { speak(state.lastAlert.sentence); return; }
  if (b.id === "dismissAlert") { state.lastAlert = null; render(); return; }
  if (b.id === "readMorning") { speak($("#morning").textContent); return; }
  if (b.id === "askBtn") return ask();
  if (b.id === "askSay" && state.lastAnswer) { speak(state.lastAnswer); return; }
  if (b.dataset.say) { const p = nearbyList().find(x => x.id === b.dataset.say); if (p) speak(p.d != null ? alertSentence(p) : p.line); return; }
  if (b.dataset.delpin) { S.set("pins." + state.trip, testPins().filter(p => p.id !== b.dataset.delpin)); render(); return; }
  if (b.id === "dropPin") {
    if (!state.pos) { toast(state.walking ? "No location yet" : "Start a walk first"); return; }
    const name = ($("#pinName").value || "").trim() || "Test pin " + (testPins().length + 1);
    const pins = testPins(); pins.push({ id: "pin-" + Date.now(), name, lat: state.pos.lat, lon: state.pos.lon, taste: 5, tags: ["test"], line: name + " is close by. That's your test pin.", pin: true });
    S.set("pins." + state.trip, pins); $("#pinName").value = "";
    const s = alertedSet(); S.set("alerted." + state.trip, [...s]);
    toast("Pin dropped. Walk away, then come back."); render(); return;
  }
  if (b.id === "resetAlerts") { S.set("alerted." + state.trip, []); const d = daily(); d.count = 0; d.hushed = false; saveDaily(d); toast("Places can alert again, and today's count is reset"); render(); return; }
  if (b.dataset.flip) { const over = S.get("evOverride", {}); const ev = allEvents().find(x => x.id === b.dataset.flip); over[ev.id] = Object.assign({}, over[ev.id], { mustMake: !ev.mustMake }); S.set("evOverride", over); render(); return; }
  if (b.dataset.delev) { S.set("events", myEvents().filter(x => x.id !== b.dataset.delev)); render(); return; }
  if (b.id === "evAdd" || b.id === "evQuick") {
    let title = ($("#evTitle").value || "").trim(), start;
    if (b.id === "evQuick") { title = title || "Test event"; start = new Date(Date.now() + 20 * 60000); }
    else {
      const tv = $("#evTime").value; if (!title || !tv) { toast("Add a name and a time"); return; }
      start = new Date(); const [hh, mm] = tv.split(":").map(Number); start.setHours(hh, mm, 0, 0);
      if (start < new Date()) start.setDate(start.getDate() + 1);
    }
    const here = $("#evHere").checked && state.pos ? { lat: state.pos.lat, lon: state.pos.lon, name: "your spot" } : null;
    const evs = myEvents(); evs.push({ id: "my-" + Date.now(), trip: state.trip, title, start: start.toISOString(), mustMake: $("#evMust").checked, status: "set by you", mine: true, place: here });
    S.set("events", evs); $("#evTitle").value = ""; toast("Added. Nudges are on the list."); render(); return;
  }
  if (b.dataset.lang) { langPick = b.dataset.lang; S.set("phraseLang", b.dataset.lang); render(); return; }
  if (b.dataset.show) { const it = PHRASES[curLang()].items[+b.dataset.show]; showBig(it); return; }
  if (b.dataset.hear) { const it = PHRASES[curLang()].items[+b.dataset.hear]; speak(it.loc, PHRASES[curLang()].voice, { slow: true }); return; }
  if (b.dataset.trdir) { trDir = b.dataset.trdir; render(); return; }
  if (b.id === "trBtn") { translate(); return; }
  if (b.id === "trMic") { listen(); return; }
  if (b.id === "trHear" && lastTr) { trSpeak(lastTr); return; }
  if (b.id === "trBig" && lastTr) { showBig({ loc: lastTr.out, en: lastTr.src, voice: lastTr.to }); return; }
  if (b.dataset.trhist) { const it = S.get("trHist." + curLang(), [])[+b.dataset.trhist]; if (it) { const o = $("#trOut"); o && o.scrollIntoView && o.scrollIntoView({ block: "center" }); showTr(it); } return; }
  if (b.dataset.rate) { settings.trRate = +b.dataset.rate; saveSettings(); render(); const P = PHRASES[curLang()]; speak(P.items[0].loc, P.voice, { slow: true }); return; }
  if (b.id === "copyVoices") { navigator.clipboard.writeText(voiceListText()).then(() => toast("Copied. Paste it to me in Claude Duet."), () => toast("Couldn't copy here")); return; }
  if (b.id === "testVoice") { speak(trip().accent && settings.accent && !trip().accent.startsWith("en") ? "Hello. This is how I sound in " + trip().name + "." : "Hello. This is how I sound on your walk."); return; }
  if (b.id === "trGo") { const txt = ($("#trText").value || "").trim(); const g = PHRASES[curLang()].gt; b.href = "https://translate.google.com/?sl=" + (trDir === "me" ? "en" : g) + "&tl=" + (trDir === "me" ? g : "en") + "&op=translate&text=" + encodeURIComponent(txt); return; }
  if (b.id === "wishAdd") return addWish();
  if (b.id === "wishCopy") { const txt = S.get("wishes", []).map(w => "- " + w.text + " (" + new Date(w.at).toLocaleString() + (w.near ? ", near " + w.near : "") + ")").join("\n"); navigator.clipboard.writeText(txt).then(() => toast("Copied"), () => toast("Couldn't copy here")); return; }
  if (b.dataset.range) { settings.rangeMi = +b.dataset.range; saveSettings(); render(); return; }
  if (b.dataset.cap) { settings.cap = +b.dataset.cap; saveSettings(); render(); return; }
  if (b.id === "testSound") { chime(); setTimeout(() => speak("This is how an alert sounds. Hush any time."), 900); return; }
  if (b.id === "closeShow") { $(".show") && $(".show").remove(); return; }
});
function showBig(it){
  const d = document.createElement("div"); d.className = "show"; d.setAttribute("role", "dialog");
  d.innerHTML = '<div class="huge">' + esc(it.loc) + '</div><div class="muted">' + esc(it.en) + '</div><div class="row" style="justify-content:center"><button class="btn" id="hearBig">Hear it</button><button class="btn primary" id="closeShow">Done</button></div>';
  document.body.appendChild(d);
  d.querySelector("#hearBig").onclick = () => it.voice === "en" ? speak(it.loc, null, { slow: true }) : speak(it.loc, PHRASES[curLang()].voice, { slow: true });
}
document.addEventListener("toggle", e => { if (e.target && e.target.id === "allSpots" && state.pos && state.pos.source === "manual") state.spotsOpenUntil = e.target.open ? Date.now() + 300000 : 0; }, true);
document.addEventListener("change", e => {
  const t = e.target;
  if (t.id === "tripSel") { state.trip = t.value; S.set("trip", t.value); langPick = null; if (state.pos && state.pos.source === "manual") state.pos = null; state.lastAlert = null; render(); return; }
  if (t.id === "locSel" && t.value) {
    const tr = trip(); const p = t.value === "__center" ? { lat: tr.center.lat, lon: tr.center.lon } : allPlaces().find(x => x.id === t.value);
    setPos({ lat: p.lat, lon: p.lon, acc: 0, ts: Date.now(), source: "manual" }); return;
  }
  if (t.id === "setVoice") { settings.voice = t.checked; saveSettings(); }
  if (t.id === "setAccent") { settings.accent = t.checked; saveSettings(); render(); }
  if (t.id === "setDeviceVoice") { settings.deviceVoice = t.checked; saveSettings(); render(); }
  if (t.dataset.voicefor) { S.set("voice." + t.dataset.voicefor, t.value); render(); speak(t.dataset.voicefor === "en" ? "Hello. This is my voice." : (t.dataset.voicefor === "de" ? "Grüß Gott. Das ist meine Stimme." : "Dobrý den. To je můj hlas."), t.dataset.voicefor === "en" ? "en-US" : (trip().accent || t.dataset.voicefor)); }
  if (t.id === "setNudges") { settings.nudges = t.checked; saveSettings(); }
  if (t.id === "setAuto") { settings.autoTrip = t.checked; saveSettings(); }
});

/* ===================== Start up ===================== */
function pickTripByDate(){
  const now = new Date();
  for (const [k, t] of Object.entries(TRIPS)) if ((t.dates || []).some(r => now >= new Date(r[0]) && now < new Date(r[1]))) return k;
  return Object.keys(TRIPS)[0];
}
(function importFromLink(){
  /* A private link can carry personal plans after #plans= so they never sit in public code. */
  const m = location.hash.match(/^#plans=([A-Za-z0-9_-]+)/);
  if (!m) return;
  try {
    const json = decodeURIComponent(escape(atob(m[1].replace(/-/g, "+").replace(/_/g, "/"))));
    const data = JSON.parse(json);
    const evs = Array.isArray(data) ? data : (data.events || []);
    if (data.trips) S.set("tripPrivate", data.trips);
    const mine = myEvents().filter(x => !evs.some(y => y.id === x.id));
    S.set("events", mine.concat(evs));
    history.replaceState(null, "", location.pathname);
    setTimeout(() => toast("Trip plans added: " + evs.length), 400);
  } catch (e) {}
})();
/* Private trip dates and papers (from the plans link) fill in what the public copy leaves out. */
(function applyPrivate(){ const pv = S.get("tripPrivate", null); if (!pv) return; for (const [k, v] of Object.entries(pv)) if (TRIPS[k]) { if (v.dates) TRIPS[k].dates = v.dates; if (v.docs) TRIPS[k].docs = v.docs; } })();
if (!state.trip || !TRIPS[state.trip]) state.trip = pickTripByDate();
render();
if ("speechSynthesis" in window) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { if (state.tab === "more") render(); }; } catch (e) {}
(async function connectClaude(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [sample, db, user, tts] = await Promise.all([claude.use("sample"), claude.use("db"), claude.use("user"), claude.use("tts")]);
    state.claude.sample = sample || null;
    state.claude.tts = tts || null;
    if (db && user) { state.claude.db = db; try { state.claude.uid = await user.id(); } catch (e) {} }
    render();
  } catch (e) {}
})();
if (BUILD.kind === "hosted" && "serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
/* If the phone opened an older saved copy, reload once to get the newest version. */
if (BUILD.kind === "hosted" && window.fetch) fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(r => r.ok ? r.json() : null).then(j => {
  if (j && j.v && j.v !== BUILD.version) { let done = false; try { done = sessionStorage.getItem("reloadedFor") === j.v; sessionStorage.setItem("reloadedFor", j.v); } catch (e) {} if (!done) location.reload(); }
}).catch(() => {});
</script>
</body></html>
